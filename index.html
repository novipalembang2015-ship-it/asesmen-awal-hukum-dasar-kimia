<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hukum Dasar Kimia</title>
<style>
:root{--bg:#eef3f7;--cd:#fff;--tx:#14283a;--mu:#5a6d7c;--ac:#2457d6;--ac2:#e0e9fb;--am:#e8a317;--bd:#cfdae4;--ok:#1b7f5c;--bad:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a24;--cd:#172633;--tx:#e6eef5;--mu:#93a7b7;--ac:#7ea2ff;--ac2:#1d3052;--am:#f0b84a;--bd:#2a3d4d;--ok:#4cc79a;--bad:#ef8b7a}}
:root[data-theme="dark"]{--bg:#0f1a24;--cd:#172633;--tx:#e6eef5;--mu:#93a7b7;--ac:#7ea2ff;--ac2:#1d3052;--am:#f0b84a;--bd:#2a3d4d;--ok:#4cc79a;--bad:#ef8b7a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:.2em 0 .4em;letter-spacing:-.01em}h2{font-size:1.2rem;margin:1.2em 0 .4em}p{margin:.5em 0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
.mu{color:var(--mu);font-size:.92rem}
button,input{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.opt{display:block;width:100%;text-align:left;background:var(--cd);border:1.5px solid var(--bd);border-radius:8px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt.on{border-color:var(--ac);background:var(--ac2)}
button:focus-visible,input:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
input[type=text]{width:100%;padding:11px;border:1.5px solid var(--bd);border-radius:8px;background:var(--cd)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button{flex:1;min-width:84px;padding:10px 6px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);cursor:pointer;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pill{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 11px;font-size:.85rem;font-weight:600;margin:2px 4px 2px 0}
.sc{display:flex;gap:10px}.sc div{flex:1;text-align:center;border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--cd)}.sc b{font-size:1.8rem;display:block;color:var(--ac)}
details{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:8px 0}summary{cursor:pointer;font-weight:600}
.rm{color:var(--bad)}.rk{color:var(--ok)}
.bal{display:flex;gap:14px;align-items:flex-end;height:150px;margin:12px 0;border-bottom:3px solid var(--tx)}
.bal div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:.8rem;text-align:center}
.bal i{display:block;width:100%;border-radius:5px 5px 0 0;transition:height .25s}
input[type=range]{width:100%;accent-color:var(--ac)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main id="app"></main>
<script>
const Q=[
{p:'A',t:'Zat berikut yang termasuk senyawa adalah ...',o:['Udara','Air (H₂O)','Gas oksigen (O₂)','Larutan garam','Besi'],k:1,e:'Senyawa tersusun dari dua unsur atau lebih dengan perbandingan tetap. Udara dan larutan garam adalah campuran.'},
{p:'A',t:'Jumlah seluruh atom dalam satu molekul glukosa (C₆H₁₂O₆) adalah ...',o:['6','12','18','24','30'],k:3,e:'Jumlahkan indeks: 6 + 12 + 6 = 24.'},
{p:'A',t:'Persamaan reaksi pembentukan air yang sudah setara adalah ...',o:['H₂ + O₂ → H₂O','2H₂ + O₂ → 2H₂O','H₂ + 2O₂ → 2H₂O','2H₂ + 2O₂ → 2H₂O','4H₂ + O₂ → 2H₂O'],k:1,e:'Jumlah atom H dan O di kiri dan kanan harus sama: 4 H dan 2 O.'},
{p:'A',t:'Diketahui Ar Ca = 40, C = 12, O = 16. Mr CaCO₃ adalah ...',o:['68','84','100','116','128'],k:2,e:'40 + 12 + (3 × 16) = 100.'},
{p:'A',t:'Dua zat bereaksi dengan perbandingan massa 2 : 3. Jika total massa 40 gram, massa zat yang bagiannya lebih besar adalah ...',o:['16 g','20 g','24 g','26 g','30 g'],k:2,e:'3/5 × 40 g = 24 g.'},
{p:'B',t:'10 g CaCO₃ dipanaskan dalam wadah tertutup menghasilkan 5,6 g CaO dan gas CO₂. Massa CO₂ adalah ...',o:['3,4 g','4,4 g','5,6 g','10 g','15,6 g'],k:1,h:'Kekekalan Massa (Lavoisier)',e:'Massa sebelum = massa sesudah, jadi CO₂ = 10 − 5,6 = 4,4 g. Gas tetap dihitung.'},
{p:'B',t:'Air dari sungai, sumur, maupun hujan selalu terdiri atas H dan O dengan perbandingan massa 1 : 8. Jika 9 g air diuraikan, diperoleh ...',o:['1 g H dan 8 g O','2 g H dan 7 g O','3 g H dan 6 g O','4,5 g H dan 4,5 g O','8 g H dan 1 g O'],k:0,h:'Perbandingan Tetap (Proust)',e:'Total bagian 1 + 8 = 9, sehingga H = 1 g dan O = 8 g.'},
{p:'B',t:'CO: 12 g C bereaksi dengan 16 g O. CO₂: 12 g C bereaksi dengan 32 g O. Untuk massa C yang sama, perbandingan massa O pada kedua senyawa adalah ...',o:['1 : 1','1 : 2','2 : 3','3 : 4','2 : 1'],k:1,h:'Perbandingan Berganda (Dalton)',e:'16 : 32 = 1 : 2, berupa bilangan bulat dan sederhana.'},
{p:'B',t:'Pada suhu dan tekanan sama, 4 L gas N₂ bereaksi sempurna dengan H₂ (N₂ + 3H₂ → 2NH₃). Volume NH₃ yang terbentuk adalah ...',o:['2 L','4 L','6 L','8 L','12 L'],k:3,h:'Perbandingan Volume (Gay-Lussac)',e:'Perbandingan volume = perbandingan koefisien: N₂ : NH₃ = 1 : 2, sehingga 4 L → 8 L.'},
{p:'B',t:'Pada suhu dan tekanan yang sama, 2 L gas N₂ dan 2 L gas CH₄ memiliki ...',o:['massa yang sama','jumlah molekul yang sama','jumlah atom yang sama','massa jenis yang sama','jumlah mol yang berbeda'],k:1,h:'Hipotesis Avogadro',e:'Volume sama pada T dan P sama berarti jumlah molekul (dan mol) sama. Massa dan jumlah atom berbeda.'},
{p:'C',t:'Cara belajar yang paling nyaman bagiku:',o:['Menonton video atau animasi','Membaca teks dan membuat catatan','Praktik langsung atau simulasi','Berdiskusi dengan teman atau guru']},
{p:'C',t:'Konteks yang paling menarik untuk belajar kimia:',o:['Makanan dan kuliner','Lingkungan, air, dan kebencanaan','Teknologi, gadget, dan game','Kesehatan dan olahraga']},
{p:'C',t:'Perangkat dan internet yang biasa kupakai belajar:',o:['Ponsel, internet stabil','Ponsel, kuota terbatas','Laptop atau tablet, internet stabil','Perangkat bergantian atau internet sering putus']},
{p:'C',t:'Rasa percaya diriku saat mengerjakan hitungan kimia:',o:['Sangat percaya diri','Cukup percaya diri','Kurang percaya diri','Sering bingung dan takut salah']},
{p:'C',t:'Aktivitas yang paling kusukai di aplikasi belajar:',o:['Video pembelajaran','Lab maya','Latihan soal dan kuis','Proyek kontekstual']}];
const PT={A:'Bagian A: Prasyarat',B:'Bagian B: Pengetahuan awal',C:'Bagian C: Profil dan minat (tidak dinilai)'};
const M=[
['Hukum Kekekalan Massa (Lavoisier)','Massa zat sebelum dan sesudah reaksi dalam sistem tertutup selalu sama.','Massa pereaksi = massa hasil reaksi.','Pita Mg 2,4 g terbakar dengan 1,6 g O₂ menghasilkan 4,0 g MgO.'],
['Hukum Perbandingan Tetap (Proust)','Senyawa murni selalu tersusun dari unsur-unsur dengan perbandingan massa tetap.','H : O dalam air = 1 : 8, berapa pun sumber airnya.','18 g air mengandung 2 g H dan 16 g O.'],
['Hukum Perbandingan Berganda (Dalton)','Jika dua unsur membentuk lebih dari satu senyawa, massa unsur kedua (untuk massa unsur pertama yang sama) berbanding sebagai bilangan bulat sederhana.','CO dan CO₂: perbandingan massa O = 1 : 2.','N₂O, NO, dan NO₂ memiliki perbandingan massa O = 1 : 2 : 4.'],
['Hukum Perbandingan Volume (Gay-Lussac)','Pada suhu dan tekanan sama, volume gas yang bereaksi dan hasil reaksi berbanding sebagai bilangan bulat sederhana.','Perbandingan volume = perbandingan koefisien reaksi.','2H₂ + O₂ → 2H₂O: 10 L H₂ memerlukan 5 L O₂ dan menghasilkan 10 L uap air.'],
['Hipotesis Avogadro','Pada suhu dan tekanan sama, gas bervolume sama mengandung jumlah molekul yang sama.','1 mol = 6,02 × 10²³ partikel; V₁/n₁ = V₂/n₂ pada T, P sama.','5 L N₂ dan 5 L CO₂ pada T, P sama memiliki jumlah molekul yang sama.']];
const PRE=['Modul prasyarat: Ar dan Mr, penyetaraan reaksi, perbandingan dan persen massa','Kerjakan 3 latihan dasar sebelum membuka hukum pertama'];
const V=['Lavoisier: sistem tertutup vs terbuka','Proust: mengapa air selalu 1 : 8','Dalton: CO dan CO₂ dibandingkan','Gay-Lussac: gas bereaksi dalam volume','Avogadro: dari volume ke mol'];
const CTX=['kuliner','lingkungan dan kebencanaan','teknologi dan game','kesehatan dan olahraga'];
const FT=['Video','Materi','Lab Maya','Diskusi'],FA=['Video','Lab Maya','Latihan','Proyek'];
let S={step:'intro',i:0,a:[],name:'',tab:'Materi'};
const $=document.getElementById('app');
const sc=(a,b)=>{let n=0;for(let i=a;i<b;i++)if(S.a[i]===Q[i].k)n++;return n};
function intro(){$.innerHTML=`<h1>Hukum Dasar Kimia</h1><p class="mu">Materi, video, dan lab maya untuk kelas kimia. Mulai dengan asesmen awal 15 soal (sekitar 20 menit) agar jalur belajarmu sesuai kesiapan dan minatmu. Hasilnya bukan nilai.</p><div class="card"><label for="n"><b>Namamu</b></label><p><input id="n" type="text" placeholder="Nama lengkap" value="${S.name}"></p><button class="btn" id="go">Mulai asesmen awal</button></div>`;
document.getElementById('go').onclick=()=>{S.name=document.getElementById('n').value.trim()||'Peserta didik';S.step='quiz';S.i=0;S.a=[];quiz()}}
function quiz(){const q=Q[S.i],c=S.a[S.i];
$.innerHTML=`<p class="mu">${PT[q.p]} · soal ${S.i+1} dari 15</p><div class="bar"><i style="width:${S.i/15*100}%"></i></div><div class="card"><p><b>${q.t}</b></p>${q.o.map((o,j)=>`<button class="opt${c===j?' on':''}" data-j="${j}">${'ABCDE'[j]}. ${o}</button>`).join('')}</div><button class="btn g" id="pv" ${S.i?'':'disabled'}>Kembali</button> <button class="btn" id="nx" ${c===undefined?'disabled':''}>${S.i==14?'Lihat hasil':'Lanjut'}</button>`;
$.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.a[S.i]=+b.dataset.j;quiz()});
document.getElementById('pv').onclick=()=>{S.i--;quiz()};
document.getElementById('nx').onclick=()=>{if(S.i==14){S.step='result';result()}else{S.i++;quiz()}}}
function info(){const A=sc(0,5),B=sc(5,10);const path=A<=2?'Fondasi':B>=4?'Pengayaan':'Reguler';return{A,B,path}}
function result(){const{A,B,path}=info();const D={Fondasi:'Kamu mulai dari penguatan prasyarat (Ar, Mr, penyetaraan, perbandingan), lalu masuk ke hukum dasar dengan petunjuk bertahap.',Reguler:'Kamu menempuh alur lengkap dari Lavoisier sampai Avogadro, dilengkapi video dan lab maya terpandu.',Pengayaan:'Materi diringkas. Kamu langsung ke lab maya terbuka, soal HOTS, dan proyek kontekstual.'}[path];
const wr=[];for(let i=0;i<10;i++)if(S.a[i]!==Q[i].k)wr.push(i);
$.innerHTML=`<h1>Halo, ${S.name}</h1><div class="sc"><div><b>${A}/5</b>Prasyarat</div><div><b>${B}/5</b>Materi awal</div></div><div class="card"><p class="mu">Jalur belajarmu</p><h2 style="margin-top:0">Jalur ${path}</h2><p>${D}</p><p><span class="pill">Konteks: ${CTX[S.a[11]]}</span><span class="pill">Fokus: ${FA[S.a[14]]}</span><span class="pill">Gaya: ${FT[S.a[10]]}</span>${[1,3].includes(S.a[12])?'<span class="pill">Mode ringan aktif</span>':''}${S.a[13]>=2?'<span class="pill">Petunjuk bertahap aktif</span>':''}</p></div>
${wr.length?`<h2>Yang perlu ditinjau (${wr.length} soal)</h2>`+wr.map(i=>`<details><summary>Soal ${i+1}${Q[i].h?': '+Q[i].h:''}</summary><p class="rm">Jawabanmu: ${S.a[i]===undefined?'-':Q[i].o[S.a[i]]}</p><p class="rk">Jawaban benar: ${Q[i].o[Q[i].k]}</p><p>${Q[i].e}</p></details>`).join(''):'<p class="rk"><b>Semua soal bagian A dan B benar.</b></p>'}
<p><button class="btn" id="hm">Masuk ke pembelajaran</button> <button class="btn g" id="rt">Ulangi asesmen</button></p>`;
document.getElementById('hm').onclick=()=>{S.step='home';S.tab=['Materi','Lab Maya','Latihan','Proyek'][0];home()};
document.getElementById('rt').onclick=()=>{S.step='quiz';S.i=0;S.a=[];quiz()}}
function home(){const{path}=info();const tabs=['Materi','Video','Lab Maya'];
let h=`<h1>Jalur ${path}</h1><p class="mu">Contoh dan studi kasus bertema ${CTX[S.a[11]]}.</p><div class="tabs">${tabs.map(t=>`<button class="${t==S.tab?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>`;
if(S.tab=='Materi'){if(path=='Fondasi')h+=`<div class="card"><b>${PRE[0]}</b><p class="mu">${PRE[1]}</p></div>`;
h+=M.map((m,i)=>`<details ${i==0&&path!='Pengayaan'?'open':''}><summary>${m[0]}</summary><p>${path=='Pengayaan'?'':'<b>Bunyi:</b> '}${m[1]}</p>${path=='Pengayaan'?'':`<p><b>Ciri:</b> ${m[2]}</p>`}<p class="mu"><b>Contoh:</b> ${m[3]}</p></details>`).join('')}
else if(S.tab=='Video'){h+=V.map((v,i)=>`<div class="card"><b>Video ${i+1}: ${v}</b><p class="mu">Durasi 3–5 menit. ${[1,3].includes(S.a[12])?'Tersedia versi ringkasan teks dan gambar.':''}</p></div>`).join('')+'<p class="mu">Tautan video belum dipasang. Guru dapat menambahkan tautan setiap video.</p>'}
else{h+=`<div class="card"><b>Lab maya: Proust, H + O → air</b><p class="mu">Atur massa hidrogen dan oksigen. Perbandingan massa H : O dalam air selalu 1 : 8, jadi salah satu pereaksi bisa bersisa.</p><p>Hidrogen: <b id="vh"></b> g<input type="range" id="h" min="0" max="10" step="0.5" value="2"></p><p>Oksigen: <b id="vo"></b> g<input type="range" id="o" min="0" max="100" step="1" value="10"></p><div class="bal" id="bl"></div><div id="tx"></div></div>`}
$.innerHTML=h;
$.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;home()});
if(S.tab=='Lab Maya'){const f=()=>{const H=+document.getElementById('h').value,O=+document.getElementById('o').value;const w=Math.min(H*9,O*9/8),uh=w/9,uo=w*8/9,sh=H-uh,so=O-uo;
document.getElementById('vh').textContent=H;document.getElementById('vo').textContent=O;
const col=[['H bersisa',sh,'var(--am)'],['O bersisa',so,'var(--tx)'],['Air terbentuk',w,'var(--ac)']];
document.getElementById('bl').innerHTML=col.map(c=>`<div><span>${c[1].toFixed(1)} g</span><i style="height:${Math.min(c[1]/100*130,130)+2}px;background:${c[2]}"></i>${c[0]}</div>`).join('');
document.getElementById('tx').innerHTML=`<p>Air terbentuk: <b>${w.toFixed(1)} g</b> (H terpakai ${uh.toFixed(1)} g, O terpakai ${uo.toFixed(1)} g, perbandingan 1 : 8).</p><p class="mu">Total sebelum: ${(H+O).toFixed(1)} g. Total sesudah (air + sisa): ${(w+sh+so).toFixed(1)} g, sama dengan sebelum (Lavoisier).</p>`};
document.getElementById('h').oninput=f;document.getElementById('o').oninput=f;f()}}
intro();
</script></body></html>
